# Bootstrap configuration: packages, dotfile links, login shell. It lives at
# the repo root so mise can read it before anything is linked. Runtime
# settings and tools are in mise/.config/mise/config.toml, linked to
# ~/.config/mise.
#
# Fresh machine:
#   bash <(curl -fsSL https://raw.githubusercontent.com/kulesh/dotfiles/main/mise.sh)
#
# Day 2 (mise reads this file only from the repo, hence -C):
#   mise -C ~/.dotfiles bootstrap packages use brew:foo
#   mise -C ~/.dotfiles bootstrap packages use brew-cask:bar
#   mup                                   # upgrade all packages and global tools
#   mise -C ~/.dotfiles bootstrap status
#   mise -C ~/.dotfiles bootstrap --dry-run
#   mise -C ~/.dotfiles dot status        # are the links in place?
#   mise -C ~/.dotfiles run preview       # link into a scratch home, print the rest

# The oldest mise this config works with; tests/ passes on it. Older ones
# misread dotfile groups and {{config_root}}. Soft, so an older mise warns and
# still runs: a hard floor locked out dsync and mup, the commands that upgrade
# it. dsync and mise.sh upgrade mise before they bootstrap.
min_version = { soft = "2026.10.22" }

# =============================================================================
# Homebrew taps
# =============================================================================

[bootstrap.brew.taps]
"kulesh/tap" = "https://github.com/kulesh/homebrew-tap"
"jnsahaj/lumen" = "https://github.com/jnsahaj/homebrew-lumen"

# =============================================================================
# System packages
# =============================================================================

[bootstrap.packages]
# Core utilities
"brew:coreutils" = { os = "macos" }
"brew:mas" = { os = "macos" }

# Search & navigation
"brew:fd" = "latest"
"brew:ripgrep" = "latest"
"brew:fzf" = "latest"
"brew:zoxide" = "latest"
"brew:tree" = "latest"

# Dev tools
"brew:neovim" = "latest"
"brew:bat" = "latest"
"brew:htop" = "latest"
"brew:highlight" = "latest"
"brew:aspell" = "latest"
"brew:pandoc" = "latest"
"brew:glow" = "latest"
"brew:mdcat" = "latest"

# Shell prompt
"brew:starship" = "latest"

# Git
"brew:git-delta" = "latest"
"brew:lazygit" = "latest"
"brew:gh" = "latest"

# Runtime management
"brew:mise" = "latest"

# File manager
"brew:yazi" = "latest"

# Benchmarking & modern coreutils
"brew:hyperfine" = "latest"
"brew:eza" = "latest"

# Containers
"brew:docker" = { os = "macos" }
"brew:docker-compose" = { os = "macos" }
"brew:colima" = { os = "macos" }

# Media & AI
"brew:yt-dlp" = "latest"
"brew:ollama" = "latest"

# Custom taps
"brew:kulesh/tap/tc" = "latest"
"brew:kulesh/tap/aiobscura" = "latest"
"brew:kulesh/tap/seatbelt" = "latest"
"brew:jnsahaj/lumen/lumen" = "latest"

# Testing
"brew:bats-core" = "latest"
"brew:tree-sitter-cli" = "latest"

# Network
"brew:mole" = "latest"

# Languages (system-level, used outside mise-managed projects)
"brew:node" = "latest"
"brew:ruby" = "latest"

# Casks (macOS GUI apps)
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:mactex" = { os = "macos" }
"brew-cask:rectangle" = { os = "macos" }

# Nerd Fonts
"brew-cask:font-fira-code-nerd-font" = { os = "macos" }
"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }
"brew-cask:font-hack-nerd-font" = { os = "macos" }
"brew-cask:font-zed-mono-nerd-font" = { os = "macos" }

# =============================================================================
# Dotfiles (ADR-010)
# =============================================================================
# Each directory below mirrors $HOME and is linked into it file by file, so
# directories like ~/dev, ~/.ssh and ~/.claude are always real directories and
# what apps write there stays out of the repo.

[settings]
dotfiles.root = "{{config_root}}"   # this checkout, wherever it is

[bootstrap]
dotfile_groups = ["bin", "claude", "dev", "ghostty", "git", "homebrew", "mise", "nvim", "pi", "sandbox", "starship", "yazi", "zsh"]

# Our ssh settings are a marked block in a real ~/.ssh/config. Tools that add
# their own lines (an Include for OrbStack, say) keep them; a link or a copy
# would put those lines in the repo or overwrite them on the next run.
[dotfiles]
"~/.ssh/config/dotfiles" = { source = "ssh/.ssh/config", template = "tera" }

# One link for the whole directory, so lazy-lock.json and other files nvim
# writes land in the repo.
[dotfile_groups.nvim]
root = "nvim"
[dotfile_groups.nvim.entries]
"~/.config/nvim" = { mode = "symlink" }

# Before mise links anything:
# 1. Stop if ~/.ssh or ~/dev resolves into the repo: keys or projects would be
#    inside the checkout, and moving them is a decision for a person.
# 2. Remove links GNU Stow made on Macs set up before ADR-010. Stow's dry run
#    lists only its own links, so this is silent once a Mac has moved over.
# 3. Move agent state back home. Stow linked ~/.claude to the repo as a whole,
#    so Claude Code wrote its state (history, todos, sessions) into the
#    checkout, where git ignores it; linking it would keep it there, one link
#    per file. What git ignores under claude/ goes to ~/.claude as real
#    files, a directory at a time; a real file already there stays, and a
#    different copy from the checkout sits beside it as <name>.from-dotfiles
#    (an identical one just goes). Only for the checkout
#    at ~/.dotfiles: a preview's scratch home takes nothing out.
# 4. Create ~/.ssh, private, for the config block below and for keys.
[bootstrap.hooks.pre-dotfiles]
description = "Prepare the home for linking"
run = """
cd "{{config_root}}"
inside_repo() { [ -L "$HOME/$1" ] && [ "$(cd -P "$HOME/$1" && pwd)" = "$(cd -P "$2" && pwd)" ]; }
if inside_repo .ssh ssh/.ssh; then
    echo "~/.ssh is a link into the repo, so your SSH keys live inside the checkout. Replace it with a real ~/.ssh (mode 700), move the keys there, and run bootstrap again." >&2
    exit 1
fi
if inside_repo dev dev/dev; then
    echo "~/dev is a link into the repo, so your projects live inside the checkout. Replace it with a real ~/dev, move the projects there, and run bootstrap again." >&2
    exit 1
fi
if command -v stow >/dev/null; then
    set --
    for package in */; do set -- "$@" "${package%/}"; done
    if stow --simulate --verbose --delete --dir=. --target="$HOME" "$@" 2>&1 | grep -q '^UNLINK:'; then
        echo "unstow: removing links made by GNU Stow"
        stow --delete --dir=. --target="$HOME" "$@"
    fi
fi
if [ "$(cd -P "$HOME/.dotfiles" 2>/dev/null && pwd)" = "$(pwd -P)" ]; then
    # Home it: a link or a gap is replaced; a real file stays, and the
    # checkout's copy goes, or sits beside it if it differs.
    home_it() {   # home_it <file in the checkout> <path in the home>
        mkdir -p "$(dirname "$2")"
        if [ -L "$2" ] || [ ! -e "$2" ]; then rm -f "$2"; mv "$1" "$2"
        elif cmp -s "$1" "$2"; then rm -f "$1"
        else mv "$1" "$2.from-dotfiles"; fi
    }
    # A whole directory at a time, in one rename, unless the home already has
    # real files of its own there; then file by file, keeping them.
    git ls-files --others --ignored --exclude-standard --directory -- claude | while IFS= read -r entry; do
        entry=${entry%/}
        target=$HOME/${entry#claude/}
        count=$(find "$entry" -type f | wc -l | tr -d ' ')
        [ "$count" = 1 ] && files="1 file" || files="$count files"
        echo "Claude Code state back home: ~/${entry#claude/} ($files)"
        if [ ! -d "$entry" ]; then home_it "$entry" "$target"; continue; fi
        # Only links and directories (an earlier run's links): nothing to lose.
        if [ -d "$target" ] && [ ! -L "$target" ] && [ -z "$(find "$target" ! -type d ! -type l -print -quit)" ]; then
            rm -rf "$target"
        fi
        if [ -L "$target" ] || [ ! -e "$target" ]; then
            mkdir -p "$(dirname "$target")"
            rm -f "$target"
            mv "$entry" "$target"
        else
            (cd "$entry" && find . -type f) | while IFS= read -r file; do
                home_it "$entry/${file#./}" "$target/${file#./}"
            done
            find "$entry" -depth -type d -empty -delete
        fi
    done
fi
mkdir -p "$HOME/.ssh"
chmod 700 "$HOME/.ssh"
"""

# =============================================================================
# Login shell
# =============================================================================

[bootstrap.user]
login_shell = "zsh"
