# Bootstrap configuration — lives at the repo root so mise can find it
# before stow runs. Runtime settings and tools stay in the stow package
# at mise/.config/mise/config.toml.
#
# Fresh machine:
#   bash <(curl -fsSL https://raw.githubusercontent.com/kulesh/dotfiles/main/mise.sh)
#
# Day 2:
#   mise bootstrap packages use brew:foo
#   mise bootstrap packages use brew-cask:bar
#   mise bootstrap packages upgrade
#   mise bootstrap status
#   mise bootstrap --dry-run

# =============================================================================
# Homebrew taps
# =============================================================================

[bootstrap.brew.taps]
"kulesh/tap" = "https://github.com/kulesh/homebrew-tap"
"jnsahaj/lumen" = "https://github.com/jnsahaj/homebrew-lumen"

# =============================================================================
# System packages
# =============================================================================

[bootstrap.packages]
# Core utilities
"brew:coreutils" = { os = "macos" }
"brew:mas" = { os = "macos" }
"brew:stow" = { os = "macos" }

# Search & navigation
"brew:fd" = "latest"
"brew:ripgrep" = "latest"
"brew:fzf" = "latest"
"brew:zoxide" = "latest"
"brew:tree" = "latest"

# Dev tools
"brew:neovim" = "latest"
"brew:bat" = "latest"
"brew:htop" = "latest"
"brew:highlight" = "latest"
"brew:aspell" = "latest"
"brew:pandoc" = "latest"
"brew:glow" = "latest"
"brew:mdcat" = "latest"

# Shell prompt
"brew:starship" = "latest"

# Git
"brew:git-delta" = "latest"
"brew:lazygit" = "latest"
"brew:gh" = "latest"

# Runtime management
"brew:mise" = "latest"

# File manager
"brew:yazi" = "latest"

# Benchmarking & modern coreutils
"brew:hyperfine" = "latest"
"brew:eza" = "latest"

# Containers
"brew:docker" = { os = "macos" }
"brew:docker-compose" = { os = "macos" }
"brew:colima" = { os = "macos" }

# Media & AI
"brew:yt-dlp" = "latest"
"brew:ollama" = "latest"

# Custom taps
"brew:kulesh/tap/tc" = "latest"
"brew:kulesh/tap/aiobscura" = "latest"
"brew:kulesh/tap/seatbelt" = "latest"
"brew:jnsahaj/lumen/lumen" = "latest"

# Testing
"brew:bats-core" = "latest"
"brew:tree-sitter-cli" = "latest"

# Network
"brew:mole" = "latest"

# Languages (system-level, used outside mise-managed projects)
"brew:node" = "latest"
"brew:ruby" = "latest"

# Casks (macOS GUI apps)
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:mactex" = { os = "macos" }
"brew-cask:rectangle" = { os = "macos" }

# Nerd Fonts
"brew-cask:font-fira-code-nerd-font" = { os = "macos" }
"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }
"brew-cask:font-hack-nerd-font" = { os = "macos" }
"brew-cask:font-zed-mono-nerd-font" = { os = "macos" }

# =============================================================================
# Login shell
# =============================================================================

[bootstrap.user]
login_shell = "zsh"
