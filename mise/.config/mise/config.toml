# ~/.config/mise/config.toml — Runtime configuration (stowed)
#
# Bootstrap config (packages, taps, login shell) lives in .mise.toml at
# the repo root because it must be readable before stow links this file.

[tools]
uv = "latest"

[settings]
# Every project under ~/dev is yours, created or cloned there by the project
# commands, so its config loads without a trust prompt. Configs elsewhere
# still ask.
trusted_config_paths = ["~/dev"]
experimental = true
idiomatic_version_file_enable_tools = []
always_keep_download = false
always_keep_install = false
verbose = false
http_timeout = "30s"
jobs = 4
not_found_auto_install = true
paranoid = false
env_file = '.env'
status = { missing_tools = "if_other_versions_installed", show_env = false, show_tools = false }
