# ~/.config/mise/config.toml — Runtime configuration (stowed)
#
# Bootstrap config (packages, taps, login shell) lives at the repo root
# in .mise.toml where mise bootstrap --from can find it.

[tools]
uv = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = []
always_keep_download = false
always_keep_install = false
verbose = false
http_timeout = "30s"
jobs = 4
not_found_auto_install = true
paranoid = false
env_file = '.env'
status = { missing_tools = "if_other_versions_installed", show_env = false, show_tools = false }
