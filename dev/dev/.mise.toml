## PLEASE DO NOT PUT SENSITIVE VALUES IN THIS FILE ##
redactions = ["SECRET_*", "*_TOKEN", "*_API_KEY", "PASSWORD"]

[tools]
python = "latest"
uv = "latest"
node = "latest"
npm = "latest"

"npm:@openai/codex" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:opencode-ai" = "latest"
"npm:playwright" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"

[env]
# Secrets come from the Keychain; add them with `secret set NAME`
_.source = { path = ".secrets.sh", redact = true }

[hooks]
# Sandbox entry/exit handled by zsh chpwd hooks, not mise
enter = 'true'
leave = 'true'
