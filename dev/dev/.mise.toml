## PLEASE DO NOT PUT SENSITIVE VALUES IN THIS FILE ##
# Values of these hidden in task output (mise run), in every project here.
redactions = ["*SECRET*", "*TOKEN*", "*PASSWORD*", "*_KEY", "*_API_KEY", "*CREDENTIAL*"]

[tools]
python = "latest"
uv = "latest"
node = "latest"
npm = "latest"

"npm:@openai/codex" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:opencode-ai" = "latest"
"npm:playwright" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"

# No secrets here: every project would get every key. A project that calls a
# model API names the keys it uses in its own .mise.toml:
#   [env]
#   ANTHROPIC_API_KEY = "{{ exec(command='secret get ANTHROPIC_API_KEY') }}"
